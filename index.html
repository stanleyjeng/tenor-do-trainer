<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenor 大調 Do 位置練習</title><!-- GitHub write access verified --><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f5f7fa;color:#182333;margin:0;padding:18px}.wrap{max-width:740px;margin:auto}h1{font-size:25px}section{background:white;padding:18px;border-radius:18px;margin:14px 0;box-shadow:0 2px 10px #0001}.keys{display:flex;flex-wrap:wrap;gap:7px}button{border:1px solid #cbd5e1;border-radius:10px;padding:10px 13px;background:white;font-size:16px;cursor:pointer}button.active{background:#152b46;color:white}.sub{color:#64748b}svg{width:100%;height:auto}.info{font-size:20px;font-weight:700;text-align:center}.tip{font-size:14px;color:#536579;line-height:1.7}</style></head><body><main class="wrap"><h1>🎼 Tenor 大調 Do 位置練習</h1><p class="sub">低音譜表｜升降調號｜首調唱名 1 = Do</p><section><h3>升記號 ♯</h3><div class="keys" id="sharp"></div><h3>降記號 ♭</h3><div class="keys" id="flat"></div></section><section><h2 id="heading">A♭ 大調 · 4♭</h2><svg id="staff" viewBox="0 0 500 260" role="img" aria-label="低音五線譜上的 Do 音符"></svg><div class="info" id="info"></div><p class="tip" id="detail"></p></section><section><h3>記憶技巧</h3><p>♯：最後一個升記號往上半音，就是大調的 Do。</p><p>♭：倒數第二個降記號，就是大調的 Do（1♭ 的 F 大調除外）。</p><p class="tip">注意：升降記號改變音高，不改變音符的線間位置。音符中心必須準確落在五線譜的線或間。</p></section></main><script>
const keys=[['C','0','C3',4],['G','1♯','G3',8],['D','2♯','D3',5],['A','3♯','A3',9],['E','4♯','E3',6],['B','5♯','B2',3],['F♯','6♯','F♯3',7],['C♯','7♯','C♯3',4],['F','1♭','F3',7],['B♭','2♭','B♭2',3],['E♭','3♭','E♭3',6],['A♭','4♭','A♭3',9],['D♭','5♭','D♭3',5],['G♭','6♭','G♭3',8],['C♭','7♭','C♭3',4]];let selected='A♭';const NS='http://www.w3.org/2000/svg';function el(tag,attrs,text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}function render(){document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.key===selected));const [name,sig,note,step]=keys.find(k=>k[0]===selected);document.getElementById('heading').textContent=name+' 大調 · '+sig;const svg=document.getElementById('staff');svg.replaceChildren();const bottom=196,space=32,y=bottom-(step-1)*space/2;for(let i=0;i<5;i++)svg.append(el('line',{x1:45,y1:bottom-i*space,x2:450,y2:bottom-i*space,stroke:'#334155','stroke-width':2}));svg.append(el('text',{x:56,y:190,'font-size':125,'font-family':'serif',fill:'#1e293b'},'𝄢'));if(note.includes('♭')||note.includes('♯'))svg.append(el('text',{x:242,y:y+11,'font-size':46,fill:'#334155'},note.includes('♭')?'♭':'♯'));svg.append(el('ellipse',{cx:310,cy:y,rx:17,ry:11,transform:`rotate(-18 310 ${y})`,fill:'#087cb5'}));svg.append(el('line',{x1:325,y1:y,x2:325,y2:y-56,stroke:'#087cb5','stroke-width':3}));document.getElementById('info').textContent=note+' = 1（Do）';document.getElementById('detail').textContent=(step%2?`第 ${(step+1)/2} 線`:`第 ${step/2} 間`)+'（由下往上數）'+(name==='A♭'?'｜《我心靈得安寧》第 296 首':'');}keys.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k[0];b.dataset.key=k[0];b.onclick=()=>{selected=k[0];render()};document.getElementById(i<8?'sharp':'flat').append(b)});render();
</script></body></html>
