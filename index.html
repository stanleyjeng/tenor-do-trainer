<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenor 大調 Do 位置練習</title>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f4f6fa;color:#192638;margin:0;padding:18px}.wrap{max-width:760px;margin:auto}h1{font-size:25px;margin-bottom:6px}section{background:#fff;padding:18px;border-radius:17px;margin:14px 0;box-shadow:0 2px 12px #0001}.keys,.actions{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #cbd5e1;border-radius:10px;padding:10px 13px;background:#fff;color:#185da6;font-size:16px;cursor:pointer}button.active,.primary{background:#17385f;color:#fff}.sub,.tip{color:#62718a}.tip{line-height:1.65;font-size:14px}svg{width:100%;height:auto}.info{text-align:center;font-size:21px;font-weight:750}.actions{margin:14px 0}select{font-size:16px;padding:10px;border:1px solid #cbd5e1;border-radius:9px;width:100%;margin:8px 0}#feedback{font-weight:650;min-height:25px}</style></head>
<body><main class="wrap"><h1>🎼 Tenor 大調 Do 位置練習</h1><p class="sub">低音譜表｜完整升降調號｜首調唱名 1 = Do</p>
<section><h3>升記號 ♯（含 C 大調）</h3><div class="keys" id="sharp"></div><h3>降記號 ♭</h3><div class="keys" id="flat"></div></section>
<section><h2 id="heading">A♭ 大調 · 4♭</h2><svg id="staff" viewBox="0 0 540 270" role="img" aria-label="低音譜表的調號及 Do 位置"></svg><div class="info" id="info"></div><p class="tip" id="detail"></p></section>
<section><h3>🎯 看調號，猜大調</h3><p class="tip">按「出題」後先觀察調號，選擇大調名稱，再按「公布答案」。</p><div class="actions"><button id="newQuiz" class="primary">出題</button><button id="reveal">公布答案</button><button id="exitQuiz">返回練習</button></div><label for="answer">選擇大調：</label><select id="answer"></select><p id="feedback" aria-live="polite"></p></section>
<section><h3>記憶技巧</h3><p>♯：最後一個升記號往上半音，就是大調的 Do。</p><p>♭：倒數第二個降記號，就是大調的 Do（只有 1♭ 的 F 大調除外）。</p><p class="tip">升降記號改變音高，不改變音符在五線譜上的線間位置。低音譜表五條線由下往上：G2、B2、D3、F3、A3。</p></section></main>
<script>
const keys=[['C',0,'C3',3],['G',1,'G3',7],['D',2,'D3',4],['A',3,'A3',8],['E',4,'E3',5],['B',5,'B2',2],['F♯',6,'F♯3',6],['C♯',7,'C♯3',3],['F',-1,'F3',6],['B♭',-2,'B♭2',2],['E♭',-3,'E♭3',5],['A♭',-4,'A♭3',8],['D♭',-5,'D♭3',4],['G♭',-6,'G♭3',7],['C♭',-7,'C♭3',3]];
// Diatonic step 0 = bass-clef bottom line G2; every increment is one line/space movement.
// Conventional bass-clef key-signature accidentals: F3 C3 G3 D3 A2 E3 B2; B2 E3 A2 D3 G2 C3 F2.
const sharpSteps=[6,3,7,4,1,5,2],flatSteps=[2,5,1,4,0,3,-1];
const NS='http://www.w3.org/2000/svg';let selected='A♭',quiz=null,quizMode=false;
function el(tag,attrs,text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}
function place(step){return step%2===0?'第 '+(step/2+1)+' 線':'第 '+((step+1)/2)+' 間'}
function signature(sig){return sig===0?'無升降記號':Math.abs(sig)+(sig>0?'♯':'♭')}
function draw(k,showDo){const [name,sig,note,step]=k,svg=document.getElementById('staff');svg.replaceChildren();const bottom=204,unit=17,at=s=>bottom-s*unit;
for(let i=0;i<5;i++)svg.append(el('line',{x1:35,y1:at(i*2),x2:510,y2:at(i*2),stroke:'#344256','stroke-width':2}));
svg.append(el('text',{x:43,y:200,'font-size':120,'font-family':'serif',fill:'#17253d'},'𝄢'));
const steps=sig>0?sharpSteps:flatSteps;
for(let i=0;i<Math.abs(sig);i++){const s=steps[i],x=168+i*29,y=at(s);if(s<0||s>8)svg.append(el('line',{x1:x-10,y1:y,x2:x+10,y2:y,stroke:'#344256','stroke-width':2}));svg.append(el('text',{x,y:y+12,'font-size':40,'font-family':'serif',fill:'#17253d','text-anchor':'middle'},sig>0?'♯':'♭'))}
if(showDo){const y=at(step);svg.append(el('ellipse',{cx:443,cy:y,rx:17,ry:11,transform:'rotate(-18 443 '+y+')',fill:'#087cb5'}));svg.append(el('line',{x1:458,y1:y,x2:458,y2:y-55,stroke:'#087cb5','stroke-width':3}));}}
function render(){quizMode=false;quiz=null;document.querySelectorAll('.keys button').forEach(b=>b.classList.toggle('active',b.dataset.key===selected));const k=keys.find(x=>x[0]===selected);document.getElementById('heading').textContent=k[0]+' 大調 · '+signature(k[1]);draw(k,true);document.getElementById('info').textContent=k[2]+' = 1（Do）';document.getElementById('detail').textContent=place(k[3])+'（由下往上數）'+(k[0]==='A♭'?'｜《我心靈得安寧》第 296 首':'');document.getElementById('feedback').textContent=''}
keys.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k[0];b.dataset.key=k[0];b.onclick=()=>{selected=k[0];render()};document.getElementById(i<8?'sharp':'flat').append(b);const o=document.createElement('option');o.value=k[0];o.textContent=k[0]+' 大調';document.getElementById('answer').append(o)});
function nextQuiz(){quiz=keys[Math.floor(Math.random()*keys.length)];quizMode=true;document.querySelectorAll('.keys button').forEach(b=>b.classList.remove('active'));document.getElementById('heading').textContent='測驗：辨認調號';draw(quiz,false);document.getElementById('info').textContent='這是哪一個大調？';document.getElementById('detail').textContent='請先作答，再公布答案。';document.getElementById('answer').value='C';document.getElementById('feedback').textContent=''}
document.getElementById('newQuiz').onclick=nextQuiz;
document.getElementById('reveal').onclick=()=>{if(!quizMode||!quiz){nextQuiz();return}const correct=document.getElementById('answer').value===quiz[0];document.getElementById('feedback').textContent=(correct?'答對了！':'再試試看！')+' 正確答案：'+quiz[0]+' 大調，Do = '+quiz[2]+'（'+place(quiz[3])+'）';document.getElementById('heading').textContent=quiz[0]+' 大調 · '+signature(quiz[1]);draw(quiz,true);document.getElementById('info').textContent=quiz[2]+' = 1（Do）'};
document.getElementById('exitQuiz').onclick=render;render();
</script></body></html>
